[project]
name = "topographer"
version = "0.1.0"
description = "Real-world topography as 6-mile hexcrawl tiles"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10.0", "requests>=2.31", "pyproj>=3.6", "shapely>=2.0", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["topographer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:pyproj.*"]
